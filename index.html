<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/tools.ico">
    <title>在线工具站</title>
    <link rel="stylesheet" href="./src/index.css">
</head>
<body>
    <!-- 图标渐变定义（供下面各个内联 SVG 复用） -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <linearGradient id="icon-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
                <stop offset="0" stop-color="#65a6bc"/>
                <stop offset="1" stop-color="#87cfde"/>
            </linearGradient>
        </defs>
    </svg>

    <div class="header">
        <div class="title-container">
            <div class="logo">
                <img src="assets/tools.png" alt="Tools Icon">
            </div>
            <h1>在线工具站</h1>
        </div>
        
        <div class="search-container">
            <input type="text" class="search-input" placeholder="搜索工具...">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <path d="M20.5 20.5l-4-4"/>
            </svg>
        </div>
    </div>

    <div class="container">
        <div class="button-container">
            <a href="https://vkitpro.dayun.cool/" class="nav-button" target="_blank">
                <div class="button-icon">
                    <img src="assets/vkit.ico" alt="icon">
                </div>
                <div class="button-text">AI创作台</div>
                <div class="button-desc">AI视频 · AI生图 · 音色克隆</div>
            </a>

            <a href="manbo" class="nav-button">
                <div class="button-icon">
                    <img src="assets/manbo.ico" alt="icon">
                </div>
                <div class="button-text">曼波配音生成器</div>
                <div class="button-desc">AI语音生成工具</div>
            </a>
            
            <a href="ranking" class="nav-button">
                <div class="button-icon">
                    <img src="assets/hang.png" alt="icon">
                </div>
                <div class="button-text">从夯到拉排行榜</div>
                <div class="button-desc">图表模板工具</div>
            </a>

            <a href="ico" class="nav-button">
                <div class="button-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="url(#icon-grad)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="3"/>
                        <circle cx="8.6" cy="8.6" r="1.7"/>
                        <path d="M21 15l-4.5-4.5L6.5 21"/>
                    </svg>
                </div>
                <div class="button-text">ICO 图标转换工具</div>
                <div class="button-desc">图片转 ICO（多尺寸）/ ICO 提取图片，本地转换</div>
            </a>

            <a href="https://docsmall.com/image-compress" class="nav-button" target="_blank">
                <div class="button-icon">
                    <img src="assets/fav-docsmall.png" alt="icon">
                </div>
                <div class="button-text">图片压缩工具</div>
                <div class="button-desc">在线图片压缩（第三方）</div>
            </a>
            
            <a href="https://squoosh.app/" class="nav-button" target="_blank">
                <div class="button-icon">
                    <img src="assets/fav-squoosh.ico" alt="icon">
                </div>
                <div class="button-text">图片压缩工具</div>
                <div class="button-desc">在线图片压缩，谷歌开发的（第三方）</div>
            </a>

            <a href="https://snapany.com/zh" class="nav-button" target="_blank">
                <div class="button-icon">
                    <img src="assets/fav-snapany.ico" alt="icon">
                </div>
                <div class="button-text">万能视频/图片解析下载</div>
                <div class="button-desc">多平台视频/图片提取工具（第三方）</div>
            </a>

            <!-- 可以继续添加更多按钮 -->
             
            <a href="#" class="nav-button" target="_blank">
                <div class="button-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="url(#icon-grad)" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </div>
                <div class="button-text">更多工具</div>
                <div class="button-desc">敬请期待</div>
            </a>
        </div>
    </div>

    <div class="footer">
        <a href="https://contact.dayun.cool" target="_blank" style="color: #999; text-decoration: none; padding: 0 12px; border-right: 1px solid #66666666; transition: color 0.3s ease;" onmouseover="this.style.color='#88cfde'" onmouseout="this.style.color='#999'">问题反馈</a>
        <span style="color: #999; padding-left: 12px; border-right: 1px solid #66666666; padding-right: 15px;"><span style="padding-right: 15px; border-right: 1px solid #66666666;">© 2025-2026 大沄</span><a href='https://space.bilibili.com/192702710' target='_blank' style='color: inherit; text-decoration: none; transition: color 0.3s ease; padding-left: 15px;' onmouseover="this.style.color='#88cfde'" onmouseout="this.style.color='inherit'">bilibili</a></span>
        <span style="color: #999; padding-left: 12px;">持续更新中v1.2.5</span>
    </div>

    <script>
        // 搜索功能
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.querySelector('.search-input');
            const navButtons = document.querySelectorAll('.nav-button');
            
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                
                navButtons.forEach(button => {
                    const buttonText = button.querySelector('.button-text').textContent.toLowerCase();
                    const buttonDesc = button.querySelector('.button-desc').textContent.toLowerCase();
                    
                    if (buttonText.includes(searchTerm) || buttonDesc.includes(searchTerm)) {
                        button.style.display = 'flex';
                    } else {
                        button.style.display = 'none';
                    }
                });
            });
            
            // 添加点击动画效果
            navButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    if (href === '#') {
                        e.preventDefault();
                    }
                    
                    // 添加点击动画
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = 'scale(1)';
                    }, 150);
                });
            });
        });
    </script>
</body>
</html>
